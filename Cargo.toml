[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The UI's minimum, set by gpui (tested with 1.98; 1.93 can't build it).
# The agent and what it uses need less: see their manifests.
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sysmon-proto = { path = "crates/proto" }
sysmon-ingest = { path = "crates/ingest" }
sysmon-store = { path = "crates/store" }
sysmon-model = { path = "crates/model" }
sysmon-notices = { path = "crates/notices" }
sysmon-notices-build = { path = "crates/notices-build" }

anyhow = "1"
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
flume = "0.11"
gpui-kit = "0.10"
jiff = "1"
signal-hook = "0.4"
libc = "0.2"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"
