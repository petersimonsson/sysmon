[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
sysmon-proto = { path = "crates/proto" }
sysmon-ingest = { path = "crates/ingest" }
sysmon-store = { path = "crates/store" }
sysmon-model = { path = "crates/model" }

anyhow = "1"
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
flume = "0.11"
gpui-kit = "0.10"
libc = "0.2"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"
